services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: take_notes
      POSTGRES_PASSWORD: take_notes
      POSTGRES_DB: take_notes
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U take_notes']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
